<!DOCTYPE html>
<html lang="ko" data-theme-support>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1.5℃ 라이프스타일 2주 살기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0EA;
  --paper-2:#E3E8DF;
  --card:#F7F9F5;
  --ink:#14302B;
  --ink-2:#3C544E;
  --ink-3:#6E837D;
  --rule:#C9D2C6;
  --rule-2:#DCE2D8;
  --over:#9E2A3B;
  --over-soft:#E8D3D6;
  --within:#2F6F55;
  --within-soft:#CFE0D6;
  --sand:#D8D2C0;
  --focus:#1B5E7A;
  --s-food:#4E7B4B; --s-consumption:#9A7B3F; --s-transport:#2F5E78;
  --s-housing:#7A4A5C; --s-leisure:#5E6B6E;

  --f: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --maxw: 640px;
  --pad: 22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101A18;
    --paper-2:#16211F;
    --card:#172320;
    --ink:#E4EBE5;
    --ink-2:#AFC0B9;
    --ink-3:#7E918B;
    --rule:#2C3C38;
    --rule-2:#223230;
    --over:#E4788A;
    --over-soft:#3A2329;
    --within:#6FC49B;
    --within-soft:#1E3A2E;
    --sand:#3A392F;
    --focus:#7FC5E0;
    --s-food:#79AE73; --s-consumption:#CBA65F; --s-transport:#6699BB;
    --s-housing:#B5818F; --s-leisure:#8FA0A3;
  }
}
:root[data-theme="dark"]{
  --paper:#101A18; --paper-2:#16211F; --card:#172320;
  --ink:#E4EBE5; --ink-2:#AFC0B9; --ink-3:#7E918B;
  --rule:#2C3C38; --rule-2:#223230;
  --over:#E4788A; --over-soft:#3A2329;
  --within:#6FC49B; --within-soft:#1E3A2E;
  --sand:#3A392F; --focus:#7FC5E0;
  --s-food:#79AE73; --s-consumption:#CBA65F; --s-transport:#6699BB;
  --s-housing:#B5818F; --s-leisure:#8FA0A3;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f);
  font-weight:400;
  font-size:16px;
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
  overflow-wrap:anywhere;
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.shell{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad) 120px}
.rail{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule-2);
  margin:0 calc(-1 * var(--pad)) 0;
  padding:12px var(--pad) 11px;
}
.rail-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.rail-stage{font-size:13px;font-weight:500;letter-spacing:-.01em}
.rail-count{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.rail-ticks{display:flex;gap:3px;margin-top:9px}
.rail-ticks i{flex:1;height:3px;background:var(--rule);border-radius:2px}
.rail-ticks i.on{background:var(--ink)}
.rail-ticks i.now{background:var(--over)}

.screen{display:none;padding-top:38px;animation:rise .34s ease both}
.screen.live{display:block}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- type ---------- */
h1{font-size:30px;line-height:1.38;font-weight:600;letter-spacing:-.025em;margin:0 0 18px}
h2{font-size:23px;line-height:1.45;font-weight:600;letter-spacing:-.02em;margin:0 0 14px}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em;margin:0 0 8px}
p{margin:0 0 15px;max-width:60ch}
.lede{font-size:17px;color:var(--ink-2);line-height:1.8}
.muted{color:var(--ink-3);font-size:14px;line-height:1.7}
.kicker{font-size:13px;color:var(--ink-3);margin:0 0 10px;font-weight:500}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.04em;font-weight:200}
.hr{height:1px;background:var(--rule-2);border:0;margin:34px 0}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px 20px;border:0;border-radius:3px;
  background:var(--ink);color:var(--paper);
  font-size:16px;font-weight:600;letter-spacing:-.01em;cursor:pointer;
  transition:opacity .15s;
}
.btn:hover{opacity:.87}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn.small{width:auto;padding:10px 16px;font-size:14px}
.btn-row{display:flex;gap:10px;margin-top:26px}
.btn-row .btn{flex:1}
.linkish{background:none;border:0;padding:0;font-size:14px;color:var(--ink-2);
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--rule);cursor:pointer}

/* ---------- number blocks ---------- */
.stat{padding:20px 0;border-top:1px solid var(--rule-2)}
.stat:last-child{border-bottom:1px solid var(--rule-2)}
.stat-label{font-size:13.5px;color:var(--ink-3);margin-bottom:2px}
.stat-val{display:flex;align-items:baseline;gap:8px}
.stat-val b{font-size:42px;font-weight:200;letter-spacing:-.045em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat-val span{font-size:13px;color:var(--ink-3)}
.stat.hero .stat-val b{font-size:74px}
.stat.mark-over .stat-val b{color:var(--over)}
.stat.mark-within .stat-val b{color:var(--within)}

.card{background:var(--card);border:1px solid var(--rule-2);border-radius:4px;padding:20px}
.note{border-left:2px solid var(--rule);padding:2px 0 2px 16px;color:var(--ink-2);font-size:15px;line-height:1.75}

/* ---------- budget line ---------- */
.bl{margin:26px 0 8px}
.bl-labels{position:relative;height:22px}
.bl-labels span{position:absolute;white-space:nowrap}
.bl-above{margin-bottom:2px}
.bl-below{margin-top:6px;height:20px}
.bl-tag{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.bl-tag.is-over{color:var(--over)}
.bl-tag.is-within{color:var(--within)}
.bl-tag.dim{font-weight:400;color:var(--ink-3)}
.bl-track{position:relative;height:16px;background:var(--rule-2);border-radius:2px}
.bl-track .fill{position:absolute;top:0;height:100%;display:block}
.bl-track .fill.within{left:0;background:var(--within);border-radius:2px 0 0 2px}
.bl-track .fill.over{background:var(--over);border-radius:0 2px 2px 0}
.bl-track .tick-lim{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--ink);border-radius:1px}
.bl-track .tick-k{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink-3);opacity:.6}
.bl-legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:16px;font-size:12.5px;color:var(--ink-3)}
.bl-legend b{font-weight:500;color:var(--ink-2)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:6px;vertical-align:baseline}

/* ---------- wizard ---------- */
.q{margin:0 0 30px}
.q-title{font-size:16.5px;font-weight:600;line-height:1.55;margin:0 0 4px;letter-spacing:-.012em}
.q-help{font-size:13.5px;color:var(--ink-3);margin:0 0 12px}
.opts{display:grid;gap:7px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  text-align:left;background:var(--card);border:1px solid var(--rule-2);
  border-radius:3px;padding:13px 15px;font-size:15px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--rule)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2);font-weight:500}
.opt em{font-style:normal;font-size:12px;color:var(--ink-3)}
.sect-head{display:flex;align-items:baseline;gap:10px;margin-bottom:26px}
.sect-head h2{margin:0}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--ink)}

/* ---------- breakdown ---------- */
.brk{display:grid;gap:11px;margin-top:22px}
.brk-row{display:grid;grid-template-columns:58px 1fr 92px;gap:10px;align-items:center;font-size:14px}
.brk-bar{height:14px;background:var(--rule-2);border-radius:2px;overflow:hidden}
.brk-bar i{display:block;height:100%;border-radius:2px}
.brk-num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px;white-space:nowrap}
.donut-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut-wrap>div{flex:1;min-width:250px}

/* ---------- action picker ---------- */
.act{
  display:block;width:100%;text-align:left;background:var(--card);
  border:1px solid var(--rule-2);border-radius:4px;padding:15px 16px;margin-bottom:9px;cursor:pointer;
  transition:border-color .12s, background .12s;
}
.act:hover{border-color:var(--rule)}
.act[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2)}
.act-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.act-name{font-size:15.5px;font-weight:600;letter-spacing:-.012em;line-height:1.45}
.act-desc{font-size:13.5px;color:var(--ink-3);margin-top:3px;line-height:1.6}
.tag{flex:none;font-size:11.5px;padding:3px 8px;border-radius:2px;background:var(--paper-2);
  color:var(--ink-2);border:1px solid var(--rule-2);white-space:nowrap;line-height:1.5}
.tag.hi{background:var(--over-soft);border-color:transparent;color:var(--over);font-weight:600}
.tag.mid{background:var(--sand);border-color:transparent;color:var(--ink-2);font-weight:500}
.pickbar{
  position:sticky;bottom:0;background:color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--rule-2);
  margin:24px calc(-1*var(--pad)) 0;padding:14px var(--pad) 18px;
}
.pickbar .cnt{font-size:13px;color:var(--ink-3);margin-bottom:9px}

/* ---------- log ---------- */
.daybar{display:flex;gap:4px;margin:0 0 22px;overflow-x:auto;padding-bottom:4px}
.daybar button{
  flex:none;width:34px;height:40px;border-radius:3px;border:1px solid var(--rule-2);
  background:var(--card);font-size:12px;font-variant-numeric:tabular-nums;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3)
}
.daybar button.done{border-color:transparent;background:var(--within-soft);color:var(--within);font-weight:600}
.daybar button.cur{border-color:var(--ink);color:var(--ink);font-weight:600}
.daybar button.mid{width:48px;font-size:10px;line-height:1.25;border-color:transparent;
  background:var(--ink);color:var(--paper);font-weight:600;margin:0 3px}
.daybar button.mid:hover{opacity:.85}
.midbanner{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--paper-2);border:1px solid var(--ink);border-radius:4px;
  padding:14px 16px;margin-bottom:18px}
.midbanner:hover{background:var(--card)}
.midbanner-t{font-size:15px;font-weight:600;letter-spacing:-.012em}
.midbanner-s{flex:1;font-size:12.5px;color:var(--ink-3);line-height:1.5}
.midbanner-a{font-size:16px;color:var(--ink-2)}
@media (max-width:420px){.midbanner{flex-wrap:wrap}.midbanner-s{flex-basis:100%}}
.daybar button i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}
.logblock{border-top:1px solid var(--rule-2);padding:20px 0 4px}
.logblock h3{display:flex;align-items:baseline;gap:8px}
.logblock h3 em{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--rule-2);border-radius:20px;
  padding:7px 13px;font-size:13.5px;cursor:pointer;transition:border-color .12s,background .12s}
.chip:hover{border-color:var(--rule)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--paper-2);font-weight:500}
.saved{font-size:13px;color:var(--within);margin-top:10px;min-height:20px}

/* ---------- change table ---------- */
.chg{display:grid;gap:0;margin:18px 0 8px}
.chg-row{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:baseline;
  padding:13px 0;border-top:1px solid var(--rule-2)}
.chg-row:last-child{border-bottom:1px solid var(--rule-2)}
.chg-name{font-size:14.5px}
.chg-val{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.chg-val s{color:var(--ink-3);text-decoration-color:var(--ink-3)}
.chg-val b{font-weight:600}
.chg-val .dn{color:var(--within)}

/* ---------- path ---------- */
.path{margin:22px 0}
.path-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;padding:14px 0;border-top:1px solid var(--rule-2)}
.path-row:last-child{border-bottom:1px solid var(--rule-2)}
.path-row b{font-size:26px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.path-arrow{color:var(--ink-3);font-size:13px;padding:6px 0 0 2px}

/* ---------- barriers ---------- */
.bar-item{padding:15px 0;border-top:1px solid var(--rule-2)}
.bar-item:last-child{border-bottom:1px solid var(--rule-2)}
.bar-q{font-size:14.5px;color:var(--ink-2)}
.bar-a{font-size:15.5px;font-weight:600;margin-top:4px;letter-spacing:-.012em}
.bar-a span{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:6px}

.resultimg{display:block;width:100%;height:auto;margin-top:16px;border:1px solid var(--rule);border-radius:4px}

/* ---------- 최종 결과 화면: 숫자 강조 ---------- */
.bold-nums .stat-val b{font-weight:500;letter-spacing:-.03em}
.bold-nums .pc-val{font-weight:600}
.bold-nums .chg-val b{font-weight:700}
.bold-nums h2{font-weight:700}

.btn.bigsecondary{flex-direction:column;gap:3px;background:var(--paper-2);color:var(--ink);
  border:1.5px solid var(--ink);padding:18px 20px;margin-top:10px}
.btn.bigsecondary:hover{background:var(--card);opacity:1}
.bs-t{font-size:17px;font-weight:600;letter-spacing:-.015em}
.bs-s{font-size:12.5px;font-weight:400;color:var(--ink-3)}

/* ---------- 비교 스케일 (1.5℃ 한계선 한 축) ---------- */
.cscale{margin:30px 0 8px}
.cs-labels{position:relative;height:24px}
.cs-labels span{position:absolute;white-space:nowrap}
.cs-above{margin-bottom:4px}
.cs-below{margin-top:8px}
.cs-tag{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink)}
.cs-tag.dim{font-weight:500;color:var(--ink-2)}
.cs-tag.isover{color:var(--over)}
.cs-track{position:relative;height:26px;background:var(--rule-2);border-radius:3px}
.cs-fill{position:absolute;top:0;height:100%;display:block}
.cs-fill.within{left:0;background:var(--within);border-radius:3px 0 0 3px}
.cs-fill.over{background:var(--over);border-radius:0 3px 3px 0}
.cs-rule{position:absolute;top:-9px;bottom:-9px;width:3px;background:var(--ink);border-radius:2px;z-index:2}
.cs-dot{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--paper);border:2.5px solid var(--ink-2);z-index:3}

/* ---------- 입력 검증 ---------- */
.fieldmsg{font-size:12.5px;color:var(--ink-3);margin:7px 0 0}
.fieldmsg.bad{color:var(--over)}
.field input.bad{border-color:var(--over)}
.selin{width:100%;background:var(--card);border:1px solid var(--rule);border-radius:3px;
  padding:13px 14px;font-family:var(--f);font-size:16px;color:var(--ink);appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
    linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 19px) calc(50% + 2px),calc(100% - 14px) calc(50% + 2px);
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.selin:focus{border-color:var(--ink);outline:none}

/* ---------- 숫자 입력 ---------- */
.numrow{display:flex;align-items:center;gap:8px}
.numrow.tight{gap:5px}
.numbtn{width:42px;height:46px;flex:none;border:1px solid var(--rule);background:var(--card);
  border-radius:3px;font-size:20px;line-height:1;cursor:pointer;color:var(--ink)}
.numrow.tight .numbtn{width:34px;height:36px;font-size:17px}
.numbtn:hover{border-color:var(--ink)}
.numin{flex:1;min-width:0;height:46px;background:var(--card);border:1px solid var(--rule);
  border-radius:3px;text-align:center;font-family:var(--f);font-size:18px;font-variant-numeric:tabular-nums;
  color:var(--ink);-moz-appearance:textfield}
.numin.small{width:58px;flex:none;height:36px;font-size:15px}
.numin::-webkit-outer-spin-button,.numin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.numin:focus{border-color:var(--ink);outline:none}
.numunit{flex:none;font-size:14px;color:var(--ink-3);min-width:26px}
.countlist{display:grid;gap:8px}
.countrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:7px 0;border-top:1px solid var(--rule-2);font-size:15px}
.countrow:last-child{border-bottom:1px solid var(--rule-2)}
.chip.locked{opacity:.4}

/* ---------- 경고 / 입력 / 경로차트 ---------- */
.warn{background:var(--over-soft);color:var(--over);font-size:13.5px;font-weight:500;
  padding:10px 14px;border-radius:3px;line-height:1.6}
.act.locked{opacity:.45}
.field{margin-bottom:18px}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:7px}
.field label em{font-style:normal;font-weight:400;color:var(--ink-3);font-size:12.5px}
.field input,.freetext{width:100%;scroll-margin-block:90px;background:var(--card);border:1px solid var(--rule);
  border-radius:3px;padding:13px 14px;font-family:var(--f);font-size:16px;color:var(--ink);line-height:1.6}
.field input:focus,.freetext:focus{border-color:var(--ink);outline:none}
.freetext{resize:vertical;min-height:80px}
.freetext::placeholder,.field input::placeholder{color:var(--ink-3)}

.pathchart{position:relative;margin:26px 0 10px;padding-top:26px}
.pc-limit{position:absolute;top:0;bottom:8px;border-left:2px solid var(--ink);z-index:2}
.pc-limit span{position:absolute;top:-4px;left:6px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pc-row{display:grid;grid-template-columns:1fr;gap:5px;margin-bottom:16px}
.pc-label{font-size:13.5px;color:var(--ink-2)}
.pc-track{position:relative;height:26px;background:var(--rule-2);border-radius:2px}
.pc-fill{display:block;height:100%;border-radius:2px}
.pc-fill.now{background:var(--over)}
.pc-fill.after{background:var(--s-transport)}
.pc-fill.goal{background:var(--within)}
.pc-rule{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.9}
.pc-val{font-size:20px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  position:absolute;right:0;top:-24px}
.pc-val em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:3px}
.pc-val.now{color:var(--over)} .pc-val.after{color:var(--s-transport)} .pc-val.goal{color:var(--within)}
.pc-row{position:relative;padding-top:24px}
.pc-gap{font-size:13px;color:var(--ink-3);margin-top:14px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:90;display:none}
.modal.live{display:block}
.modal-bg{position:absolute;inset:0;background:rgba(10,20,18,.5)}
.modal-box{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(560px, calc(100vw - 32px));max-height:86vh;overflow-y:auto;
  background:var(--paper);border-radius:6px;padding:28px 24px 24px;
}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--ink-3);line-height:1}

function load(){
  // ?fresh=1 로 열면 저장된 기록을 지우고 완전히 처음부터 시작합니다.

  }catch(e){}
  // 링크를 연 사람은 언제나 첫 화면에서 시작합니다.
  // 이전에 진행하던 자리는 첫 화면의 '이어서 하기'로만 돌아갑니다.
  S.resumeTo = (S.screen && S.screen !== "intro") ? S.screen : null;

const $ = sel => document.querySelector(sel);
const fmt = (n, d=1) => Number(n).toFixed(d);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));


/* ============================================================
   계산 엔진
   ============================================================ */
const num = (v, d=0) => (v === undefined || v === null || v === "" || isNaN(v)) ? d : Number(v);
const sumCounts = (obj, items) => (items||[]).reduce((s,[k,,c])=> s + num(obj && obj[k]) * c, 0);

function calculate(){
  const a = S.answers, F = CARBON_FACTORS;
  const p = {};   // 문항별 배출량

  // 먹거리
  p.eatOut = num(a.eatOut) * F.food.eatOut;
  p.diet   = a.diet === undefined ? 0 : F.food.diet[a.diet];
  p.coffee = a.coffee === 1 ? F.food.coffee : 0;
  p.waste  = a.waste  === 1 ? F.food.waste  : 0;
  const food = p.eatOut + p.diet + p.coffee + p.waste;

  // 소비
  p.clothes    = num(a.clothes) * F.consumption.clothes;
  p.mend       = num(a.mend) * F.consumption.mend;           // 음수
  p.appliances = sumCounts(a.appliances, F.consumption.appliances);
  p.devices    = sumCounts(a.devices,    F.consumption.devices);
  p.pets       = sumCounts(a.pets,       F.consumption.pets);
  const consumption = p.clothes + p.mend + p.appliances + p.devices + p.pets;

  // 교통 (주당 시간 × 계수)
  p.subway = num(a.subway) * F.transport.subway;
  p.bus    = num(a.bus)    * F.transport.bus;
  p.bike   = num(a.bike)   * F.transport.bike;
  p.ev     = num(a.ev)     * F.transport.ev;
  p.car    = num(a.car)    * F.transport.car;
  p.train  = num(a.train) * F.transport.train;   // 시간 × (200km × 14g)
  p.flight = num(a.flight) * F.transport.flight;
  const transport = p.subway + p.bus + p.bike + p.ev + p.car + p.train + p.flight;

  // 주거
  const members = Math.max(1, num(a.members, 1));
  const areaPerPerson = num(a.areaTotal) / members;
  p.building = areaPerPerson * F.housing.areaPerPyeong;
  const ht = F.housing.heatTypes[a.heatType === undefined ? 0 : a.heatType];
  // 전기·난방은 고지서 기준 가구 단위 값이므로 가구원 수로 나눠 1인분으로 둡니다.
  // 이후 감축 잠재력과 하루 기록 환산도 모두 이 1인분 값을 씁니다.
  const div = CONFIG.SPLIT_HOUSEHOLD_ENERGY ? members : 1;
  const elecHouse = (a.elec === undefined) ? 0
         : F.housing.elecKwh[a.elec] * 12 * F.housing.elecPerKwh;
  const heatHouse = (a.heatCost === undefined) ? 0 : ht[2][a.heatCost];
  p.elecHouse = elecHouse; p.heatHouse = heatHouse;
  p.elec = elecHouse / div;
  p.heating = heatHouse / div;
  p.solar   = F.housing.solar[a.solar || 0];                 // 0 또는 음수
  p.insulation = a.insulation === 1 ? areaPerPerson * F.housing.insulationPerPyeong : 0;
  p.ai = a.ai === undefined ? 0 : F.housing.ai[a.ai];
  const housing = p.building + p.elec + p.heating + p.solar + p.insulation + p.ai;

  // 여가
  const ways = a.leisureWays || [];
  p.tv     = ways.includes("tv")     ? F.leisure.tv     : 0;
  p.mobile = ways.includes("mobile") ? F.leisure.mobile : 0;
  p.game   = ways.includes("game")   ? F.leisure.game   : 0;
  p.book   = ways.includes("book")   ? F.leisure.book   : 0;
  p.ski    = num(a.ski)   * F.leisure.ski;
  p.golf   = num(a.golf)  * F.leisure.golf;
  p.stay   = num(a.stay)  * F.leisure.stay;
  const leisure = p.tv + p.mobile + p.game + p.book + p.ski + p.golf + p.stay;

  const sectors = {
    food: Math.max(0, food), consumption: Math.max(0, consumption),
    transport: Math.max(0, transport), housing: Math.max(0, housing),
    leisure: Math.max(0, leisure)
  };
  const total = SECTOR_KEYS.reduce((s,k)=>s+sectors[k], 0);
  const gap = total - CONFIG.TARGET_2030;
  const rate = gap > 0 ? (gap / total * 100) : 0;
  return { sectors, total, gap, rate, parts:p, ans:a,
           raw:{ members, areaPerPerson }, under: gap <= 0 };
}

/* 계산기 응답에서 하루치 기준선을 뽑아냅니다 */
function baseline(){
  const a = S.answers, D = CARBON_FACTORS.daily, res = calculate();
  const meatMealsWeek = [7, 3, 0][a.diet === undefined ? 1 : a.diet];
  return {
    meatMealsDay: meatMealsWeek / 7,
    eatOutDay:    num(a.eatOut) / 7,
    coffeeDay:    a.coffee === 1 ? 3 : 1,
    clothesDay:   num(a.clothes) / 365,
    carHoursDay:  (num(a.car) + num(a.ev)) / 7,
    // 교통수단별 하루 평균 이용 시간 (계산기의 주당 시간 ÷ 7)
    hoursDay: { car:num(a.car)/7, ev:num(a.ev)/7, subway:num(a.subway)/7,
                bus:num(a.bus)/7, bike:num(a.bike)/7 },
    // 하루치 교통 배출량 기준선(kg)
    transportDayKg: ["car","ev","subway","bus","bike"]
      .reduce((t,m)=> t + (num(a[m])/7) * kgPerHour(m), 0),
    aiDayKg: res.parts.ai * 1000 / 365,
    carKgPerHour: (num(a.car) + num(a.ev)) > 0
                    ? ((p=>p)(res.parts.car + res.parts.ev) * 1000 / 52) / Math.max(0.01, num(a.car)+num(a.ev))
                    : 0,
    heatDayKg:    res.parts.heating * 1000 / 365,
    elecDayKg:    res.parts.elec * 1000 / 365,
    leisureDayKg: (res.parts.tv + res.parts.mobile + res.parts.game) * 1000 / 365,
    meatMealsWeek, res
  };
}

/* 일일 기록의 이용 시간 선택지 → 시간 */
const HOUR_OPTS = [0, 0.5, 1, 2, 3];
const CAR_HOUR_OPTS = HOUR_OPTS;          // 이전 이름 유지

/* 교통수단별 1시간당 배출량(kg)
   계산기 계수는 '주당 1시간 = 연간 X톤'이므로, 1시간당 = X × 1000 ÷ 52 주 입니다. */
function kgPerHour(mode){
  return CARBON_FACTORS.transport[mode] * 1000 / 52;
}
const LOG_MODES = [
  { f:"carhr",     mode:"car",    label:"내연기관 승용차" },
  { f:"evhr",      mode:"ev",     label:"전기승용차" },
  { f:"subwayhr",  mode:"subway", label:"지하철" },
  { f:"bushr",     mode:"bus",    label:"버스" },
  { f:"bikehr",    mode:"bike",   label:"자전거" }
];

/* 하루 기록 → 감축량(kg) */
function dayReduction(log, b){
  if(!log) return 0;
  const D = CARBON_FACTORS.daily;
  let r = 0;
  if(log.meat !== undefined){
    const d = b.meatMealsDay - log.meat;         if(d > 0) r += d * D.meatMeal;
  }
  if(log.eatout !== undefined){
    const d = b.eatOutDay - log.eatout;          if(d > 0) r += d * D.eatOut;
  }
  if(log.coffee !== undefined){
    const d = b.coffeeDay - log.coffee;          if(d > 0) r += d * D.coffee;
  }
  if(log.buy !== undefined){
    const d = b.clothesDay - log.buy;            if(d > 0) r += d * D.clothes;
  }
  // 교통: 기록한 수단별 시간으로 그날 배출량을 계산해 기준선과 비교합니다.
  const loggedModes = LOG_MODES.filter(m => log[m.f] !== undefined);
  if(loggedModes.length){
    const todayKg = loggedModes.reduce((t,m)=> t + HOUR_OPTS[log[m.f]] * kgPerHour(m.mode), 0);
    // 기록하지 않은 수단은 평소대로 이용한 것으로 봅니다.
    const restKg = LOG_MODES.filter(m => log[m.f] === undefined)
      .reduce((t,m)=> t + b.hoursDay[m.mode] * kgPerHour(m.mode), 0);
    const d = b.transportDayKg - (todayKg + restKg);
    if(d > 0) r += d;
  }
  if(log.heat)  r += b.heatDayKg * [0, 0.15, 0.33][log.heat];
  if(log.ai !== undefined){
    // 인공지능 사용을 줄인 만큼 (안 씀 0 / 조금 절반 / 평소대로 그대로)
    const d = b.aiDayKg * [1, 0.5, 0][log.ai];
    if(d > 0) r += d;
  }
  if(log.power) r += b.elecDayKg * 0.3;
  if(log.screen) r += b.leisureDayKg * 0.5;
  return r;
}

function programSummary(){
  const b = baseline(), res = calculate();
  const days = Object.keys(S.logs).map(Number).filter(d => S.logs[d] && S.logs[d]._done);
  let totalKg = 0;
  const sum = { meat:0, eatout:0, coffee:0, buy:0, carhr:0, evhr:0, subwayhr:0, bushr:0, bikehr:0,
                heatDays:0, powerDays:0, screenDays:0, aiDays:0 };
  days.forEach(d=>{
    const l = S.logs[d];
    totalKg += dayReduction(l, b);
    sum.meat   += l.meat   || 0;
    sum.eatout += l.eatout || 0;
    sum.coffee += l.coffee || 0;
    sum.buy    += l.buy    || 0;
    LOG_MODES.forEach(m=>{ if(l[m.f] !== undefined) sum[m.f] += HOUR_OPTS[l[m.f]]; });
    if(l.heat)   sum.heatDays++;
    if(l.power)  sum.powerDays++;
    if(l.screen) sum.screenDays++;
    if(l.ai === 0) sum.aiDays++;
  });
  const n = days.length || 1;
  const annualT = (totalKg / n) * 365 / 1000;
  const after = Math.max(0, res.total - annualT);
  const bcount = {};
  days.forEach(d=>(S.logs[d].barriers||[]).forEach(x=>{ if(x!=="none") bcount[x]=(bcount[x]||0)+1; }));
  const topBarriers = Object.entries(bcount).sort((x,y)=>y[1]-x[1]);
  const notes = days.filter(d => (S.logs[d].note||"").trim())
                    .map(d => ({ day:d+1, text:S.logs[d].note.trim() }));
  return { days:days.length, totalKg, annualT, after, sum, base:b, res, topBarriers, notes };
}

function pathChart(now, after, target){
  const max = Math.max(CONFIG.KOREA_AVG, now * 1.08, target * 1.6);

  const rows = [
    { label:"현재",                     v: now,    cls:"now"  },
    { label:"이 실천을 1년간 지속하면", v: after,  cls:"after"},
    { label:"2030년 1.5℃ 목표",        v: target, cls:"goal" }
  ];
  const tP = p(target);
  return `
  <div class="pathchart">
    <div class="pc-limit" style="left:${tP.toFixed(2)}%"><span>1.5℃ 한계선 ${fmt(target)}</span></div>
    ${rows.map(r=>`
      <div class="pc-row">
        <div class="pc-label">${esc(r.label)}</div>
        <div class="pc-track">
          <i class="pc-fill ${r.cls}" style="width:${p(r.v).toFixed(2)}%"></i>

    <div class="pc-gap">감축 ${fmt(Math.max(0, now-after))}톤 &nbsp;·&nbsp; 목표까지 ${fmt(Math.max(0, after-target))}톤 남음</div>
  </div>`;
}

function donut(sectors, total){
  const R = 54, C = 2*Math.PI*R, sw = 22;
  let acc = 0, segs = "";
  const entries = SECTOR_KEYS.map(k=>[k, sectors[k]]).sort((a,b)=>b[1]-a[1]);
  entries.forEach(([k,v])=>{
    const frac = v/total;
    segs += `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${SECTORS[k].color}"
      stroke-width="${sw}" stroke-dasharray="${(frac*C).toFixed(2)} ${C.toFixed(2)}"
      stroke-dashoffset="${(-acc*C).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
    acc += frac;
  });
  return `<svg viewBox="0 0 140 140" width="140" height="140" role="img" aria-label="분야별 배출 비중">
    ${segs}
    <text x="70" y="68" text-anchor="middle" font-size="24" font-weight="200"
      font-family="var(--f)" fill="var(--ink)" letter-spacing="-1">${fmt(total)}</text>
    <text x="70" y="82" text-anchor="middle" font-size="9" font-family="var(--f)" fill="var(--ink-3)">연간 톤</text>
  </svg>`;
}

function breakdown(sectors, total){
  const entries = SECTOR_KEYS.map(k=>[k, sectors[k]]).sort((a,b)=>b[1]-a[1]);
  const maxV = entries[0][1];
  return `<div class="brk">` + entries.map(([k,v])=>`
    <div class="brk-row">
      <span>${SECTORS[k].name}</span>
      <span class="brk-bar"><i style="width:${(v/maxV*100).toFixed(1)}%;background:${SECTORS[k].color}"></i></span>
      <span class="brk-num">${fmt(v,1)}톤 · ${Math.round(v/total*100)}%</span>
    </div>`).join("") + `</div>`;
}

function formatPhone(v){
  const d = String(v||"").replace(/[^0-9]/g,"").slice(0,11);
  if(d.length < 4) return d;
  if(d.length < 8) return d.slice(0,3) + "-" + d.slice(3);
  return d.slice(0,3) + "-" + d.slice(3,7) + "-" + d.slice(7);
}
function phoneValid(v){
  return /^01[016789]-\d{3,4}-\d{4}$/.test(String(v||"").trim());
}
function profileReady(){

  return (pf.name||"").trim().length >= 1 && phoneValid(pf.contact);
}

/* ============================================================
   구글 시트로 결과 보내기
   계산을 마쳤을 때 한 번, 2주를 마쳤을 때 한 번 보냅니다.
   CONFIG.SUBMIT_URL 이 비어 있으면 보내지 않고 기기에만 저장합니다.
   ============================================================ */
function buildSubmission(stage){
  const pf = S.profile || {}, r = calculate();
  const pre = id => { const q = PRE_QUESTIONS.find(x=>x.id===id);
    return (q && pf[id] !== undefined) ? q.o[pf[id]] : ""; };
  const actName = i => { const a = ACTIONS.find(x=>x.id===S.picked[i]); return a ? a.name : ""; };
  const d = {
    key: CONFIG.SUBMIT_KEY,                  // Apps Script 의 SECRET 과 대조합니다
    stage,                                   // "계산완료" 또는 "2주완료"
    name: pf.name||"", contact: pf.contact||"",
    region: pre("region"), age: pre("age"), gender: pre("gender"), spend: pre("spend"),
    food: +r.sectors.food.toFixed(2), consumption: +r.sectors.consumption.toFixed(2),
    transport: +r.sectors.transport.toFixed(2), housing: +r.sectors.housing.toFixed(2),
    leisure: +r.sectors.leisure.toFixed(2),
    total: +r.total.toFixed(2), target: CONFIG.TARGET_2030,
    gap: +r.gap.toFixed(2), rate: Math.round(r.rate),
    action1: actName(0), action2: actName(1), action3: actName(2),
    days:"", reducedKg:"", annualT:"", afterT:"", remainT:"",
    policy1a:(S.policies||[])[0]||"", policy1b:(S.policies||[])[1]||"", policy1c:(S.policies||[])[2]||"",
    policy2a:(S.policies2||[])[0]||"", policy2b:(S.policies2||[])[1]||"", policy2c:(S.policies2||[])[2]||"",
    barrier1:"", barrier2:"", barrier3:"",
    social:(S.social||[]).join(" / "), notes:""
  };
  if(stage === "2주완료"){
    const P = programSummary();
    d.days = P.days;
    d.reducedKg = +P.totalKg.toFixed(1);
    d.annualT = +P.annualT.toFixed(2);
    d.afterT = +P.after.toFixed(2);
    d.remainT = +Math.max(0, P.after - CONFIG.TARGET_2030).toFixed(2);
    const bl = P.topBarriers.map(([id,c])=>{
      const B = BARRIERS.find(x=>x.id===id); return B ? `${B.label}(${c}일)` : ""; });
    d.barrier1 = bl[0]||""; d.barrier2 = bl[1]||""; d.barrier3 = bl[2]||"";
    d.notes = P.notes.map(n=>`${n.day}일차: ${n.text}`).join(" / ");
  }
  return d;
}

function submitResults(stage){
  S.sent = S.sent || {};
  if(S.sent[stage] || !CONFIG.SUBMIT_URL) return;
  S.sent[stage] = "보내는 중";
  fetch(CONFIG.SUBMIT_URL, {
    method:"POST", mode:"no-cors",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(buildSubmission(stage))
  }).then(()=>{ S.sent[stage] = "완료"; save(); })
    .catch(()=>{ S.sent[stage] = "실패"; save(); });
  save();
}

/* 전송이 안 되는 환경을 위해 운영자가 직접 받을 수 있는 CSV */
function downloadCsv(){
  const d = buildSubmission(S.screen === "final" ? "2주완료" : "계산완료");
  const head = ["제출시각","구분","이름","연락처","지역","연령대","성별","월소비지출",
    "먹거리","소비","교통","주거","여가","총배출량(톤)","목표(톤)","격차(톤)","감축필요율(%)",
    "선택한실천1","선택한실천2","선택한실천3","기록일수","2주감축량(kg)","연간환산감축(톤)",
    "지속시배출량(톤)","남은격차(톤)","정책1차_1","정책1차_2","정책1차_3",
    "정책2차_1","정책2차_2","정책2차_3","주요장벽1","주요장벽2","주요장벽3",
    "사회적기초_해당항목","자유기록"];
  const row = [new Date().toISOString(), d.stage, d.name, d.contact, d.region, d.age, d.gender, d.spend,
    d.food, d.consumption, d.transport, d.housing, d.leisure, d.total, d.target, d.gap, d.rate,
    d.action1, d.action2, d.action3, d.days, d.reducedKg, d.annualT, d.afterT, d.remainT,
    d.policy1a, d.policy1b, d.policy1c, d.policy2a, d.policy2b, d.policy2c,
    d.barrier1, d.barrier2, d.barrier3, d.social, d.notes];
  const esc2 = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const csv = "\uFEFF" + head.map(esc2).join(",") + "\n" + row.map(esc2).join(",") + "\n";
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${(S.profile||{}).name||"참가자"}_결과.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

/* ---------- ④ 계산기 wizard ---------- */
function qAnswered(q){
  const v = S.answers[q.id];
  // 숫자·개수 문항은 기본값 0이 곧 응답입니다. 비워두어도 넘어갑니다.
  if(q.type === "num" || q.type === "count") return true;
  if(q.type === "multi") return Array.isArray(v);
  return v !== undefined;
}

function renderQuestion(q){
  const v = S.answers[q.id];
  let body = "";

  if(q.type === "num"){
    const step = q.step || 1;
    body = `<div class="numrow">
      ${q.plain?``:`<button class="numbtn" data-num="${q.id}" data-delta="${-step}" aria-label="줄이기">−</button>`}
      <input class="numin" data-numinput="${q.id}" type="number" inputmode="decimal"
        min="${q.min||0}" max="${q.max||999}" step="${step}"
        value="${(v === undefined || v === "") ? 0 : v}">
      <span class="numunit">${esc(q.unit||"")}</span>
      ${q.plain?``:`<button class="numbtn" data-num="${q.id}" data-delta="${step}" aria-label="늘리기">+</button>`}
    </div>`;
  }
  else if(q.type === "yesno"){
    body = `<div class="opts two">
      ${["아니오","예"].map((o,i)=>`<button class="opt" data-q="${q.id}" data-i="${i}"
        aria-pressed="${v===i}">${o}</button>`).join("")}
    </div>`;
  }
  else if(q.type === "one"){
    body = `<div class="opts ${q.o.length>3?"two":""}">
      ${q.o.map((o,i)=>`<button class="opt" data-q="${q.id}" data-i="${i}"
        aria-pressed="${v===i}">${esc(o)}</button>`).join("")}
    </div>`;
  }
  else if(q.type === "multi"){
    const sel = Array.isArray(v) ? v : [];
    body = `<div class="opts">
      ${q.o.map(([k,label])=>`<button class="opt" data-multi="${q.id}" data-k="${k}"
        aria-pressed="${sel.includes(k)}">${esc(label)}</button>`).join("")}
    </div>`;
  }
  else if(q.type === "count"){
    const items = CARBON_FACTORS.consumption[q.items];
    const cur = v || {};
    body = `<div class="countlist">
      ${items.map(([k,label])=>`
        <div class="countrow">
          <span>${esc(label)}</span>
          <span class="numrow tight">
            <button class="numbtn" data-count="${q.id}" data-k="${k}" data-delta="-1">−</button>
            <input class="numin small" data-countinput="${q.id}" data-k="${k}" type="number"
              inputmode="numeric" min="0" max="20" value="${num(cur[k])}">
            <button class="numbtn" data-count="${q.id}" data-k="${k}" data-delta="1">+</button>
          </span>
        </div>`).join("")}
    </div>`;
  }

  return `<div class="q">
    <p class="q-title">${esc(q.t)}</p>
    ${q.h?`<p class="q-help">${esc(q.h)}</p>`:``}
    ${q.tbd?`<p class="q-help" style="color:var(--over)">${esc(q.tbd)}</p>`:``}
    ${body}
  </div>`;
}

function scCalc(){
  const k = SECTOR_KEYS[S.wizardStep];
  const qs = QUESTIONS[k];
  const missing = qs.filter(q => !qAnswered(q));
  const last = S.wizardStep === SECTOR_KEYS.length-1;
  return `
  <div class="sect-head">
    <h2 style="color:${SECTORS[k].color}">${SECTORS[k].name}</h2>
    <span class="dots">${SECTOR_KEYS.map((_,i)=>`<i class="${i<=S.wizardStep?"on":""}"></i>`).join("")}</span>

  ${SECTION_NOTES[k] ? `<p class="note" style="margin:-10px 0 26px">${esc(SECTION_NOTES[k])}</p>` : ``}
  ${qs.map(renderQuestion).join("")}
  <div class="btn-row">

    <button class="btn" data-calcnext ${missing.length?"disabled":""}>${last?"결과 보기":"다음"}</button>

  ${missing.length?`<div class="warn" style="margin-top:12px">아직 ${missing.length}개 문항이 비어 있습니다.
    해당 없으면 0을 적거나 ‘아니오’를 선택해주세요.</div>`:``}
`;
}

}

/* ---------- 정책 3가지 선택 (7일차 / 14일차 두 번) ---------- */
function policyKey(){ return S.policyRound === 2 ? "policies2" : "policies"; }
function scPolicy(){
  const r = calculate();
  const list = r.under ? POLICIES_SOCIAL : POLICIES_REDUCE;
  const round2 = S.policyRound === 2;
  const sel = S[policyKey()] || [];
  const first = S.policies || [];
  return `
  <p class="kicker">${round2 ? "2주를 마치며" : CONFIG.MIDPOINT_DAY + "일차"}</p>
  <h1>${round2 ? "지금은 어떤 정책이<br>필요하다고 생각하시나요?"
               : "직접 해보니<br>무엇이 필요하던가요?"}</h1>
  <p class="lede">${round2
    ? "2주를 모두 겪은 지금, 다시 골라주세요. 처음과 달라져도 좋습니다. 그 변화가 이 실험의 결과입니다."
    : (r.under ? "부족한 생활 조건을 채우기 위해 필요한 정책 3가지를 고르세요."
               : "일주일 동안 실천해보며 느낀, 개인의 노력만으로는 어려웠던 부분을 떠올려 정책 3가지를 고르세요.")}</p>
  ${round2 && first.length ? `
    <div class="card" style="margin-top:20px;padding:14px 16px">
      <div class="muted" style="margin-bottom:6px">${CONFIG.MIDPOINT_DAY}일차에 고르셨던 것</div>
      ${first.map(x=>`<div style="font-size:14px">· ${esc(x)}</div>`).join("")}
    </div>` : ``}
  <div class="chips" style="margin-top:24px">
    ${list.map(x=>{
      const on = sel.includes(x);
      const locked = !on && sel.length >= 3;
      return `<button class="chip${locked?" locked":""}" data-policy="${esc(x)}"
        aria-pressed="${on}">${esc(x)}</button>`;
    }).join("")}
  </div>
  <div class="pickbar">
    <div class="cnt">${sel.length} / 3 선택${sel.length===3?" — 선택이 끝났습니다":""}</div>
    ${S.policyWarn?`<div class="warn" style="margin-bottom:9px">이미 3개를 골랐습니다. 바꾸려면 먼저 하나를 해제해주세요.</div>`:``}
    <div style="display:flex;gap:10px">
      <button class="btn ghost" data-go="${round2 ? "final" : "midpoint"}" style="flex:1">이전</button>
      <button class="btn" data-policy-done style="flex:2">${round2 ? "최종 결과 보기" : "8일차 기록 시작하기"}</button>
    </div>
  </div>`;
}

/* ---------- ⑥ 격차를 행동으로 ---------- */
function rankedActions(onlyTwoWeek){
  const r = calculate();
  return ACTIONS.filter(a => !onlyTwoWeek || a.twoWeek)
                .map(a=>({ a, p: Math.max(0, a.potential(r) || 0) }))
                .sort((x,y)=>y.p-x.p);
}
function potTag(p){
  if(p >= 0.45) return `<span class="tag hi">감축 잠재력 높음</span>`;
  if(p >= 0.18) return `<span class="tag mid">감축 잠재력 중간</span>`;
  return `<span class="tag">생활실험 추천</span>`;
}
function scActions(){
  const r = calculate();
  const list = rankedActions().slice(0,6);
  return `
  <h1>${r.under ? "이미 낮은 곳과,<br>더 실험해볼 수 있는 곳" : fmt(r.gap)+"톤의 차이,<br>어디에서 줄여볼 수 있을까요?"}</h1>
  <p class="lede">${r.under
    ? "지금의 생활을 유지하면서, 조건이 바뀌면 더 해볼 수 있는 행동을 함께 살펴봅니다."
    : "계산 결과를 바탕으로, 당신의 생활에서 변화의 가능성이 큰 순서대로 정리했습니다."}</p>
  <div style="margin:28px 0 8px">
    ${list.map(({a,p},i)=>`
      <div class="act" style="cursor:default">
        <div class="act-top">
          <div>
            <div class="act-name">${i+1}. ${esc(a.name)}</div>
            <div class="act-desc">${SECTORS[a.sector].name} · ${esc(a.desc)}</div>
          </div>
          ${potTag(p)}
        </div>
      </div>`).join("")}
  </div>
  <hr class="hr">
  <p class="note">${fmt(Math.max(r.gap,0))}톤을 2주 만에 줄이자는 이야기가 아닙니다.
  2주 살기는 연간 목표를 달성하는 프로그램이 아닙니다.</p>
  <p style="margin-top:18px">2주의 목적은 ${r.under
    ? `<b>지금의 낮은 배출 생활을 무엇이 가능하게 하고 있는지, 또 어떤 부분은 더 나아가기 어려운지를 직접 확인해보는 것</b>입니다.
       이미 목표선 안에 계시므로 배출량을 더 줄이는 것이 목적이 아닙니다.`
    : `<b>${fmt(CONFIG.TARGET_2030)}톤 생활이 가능하려면 나의 생활에서 무엇을 바꿀 수 있고,
       무엇은 개인의 노력만으로 바꾸기 어려운지를 직접 실험해보는 것</b>입니다.`}</p>
  <p class="muted">배출량을 목표치까지 맞추는 것이 아니라, 그 생활이 지금 조건에서 가능한지를 확인하는 것이 2주의 목적입니다.</p>
  <div class="btn-row">
    <button class="btn ghost" data-go="result">이전</button>
    <button class="btn" data-go="twoweek">다음</button>
  </div>`;
}

/* ---------- ⑦ 2주 살기 진입 ---------- */
function scTwoweek(){
  return `
  <h1>${fmt(CONFIG.TARGET_2030)}톤의 삶을<br>2주 동안 미리 살아봅니다.</h1>

  <p class="lede">앞으로 필요한 생활변화를 직접 시도해보고, 어떤 선택은 가능했고
  어떤 선택은 교통, 주거, 시간, 비용 같은 조건 때문에 어려웠는지 확인합니다.</p>
  <hr class="hr">

  <div class="chg" style="margin-top:8px">

    <div class="chg-row"><span class="chg-name">내가 고른 실천</span><span class="chg-val">공통 기록과 자동 연동</span></div>
    <div class="chg-row"><span class="chg-name">이동·에너지 실천</span><span class="chg-val">고른 사람만 추가 기록</span></div>
    <div class="chg-row"><span class="chg-name">어려웠던 이유</span><span class="chg-val">그날그날 함께 기록</span></div>
  </div>
  <p class="muted" style="margin-top:16px">같은 행동을 두 번 입력하지 않습니다.
  먹거리·소비 실천을 골랐다면 공통 기록이 곧 그 실천의 기록이 됩니다.</p>
  <p class="note" style="margin-top:16px">이미 하고 있는 일은 새로운 실천이 아닙니다.<br>
  평소에 채식을 하고 있다면 ‘고기 없는 식사 늘리기’는 고르지 마세요.
  지금까지 해보지 않았거나, 해보려다 잘 안 됐던 것을 고르는 편이 2주 동안 더 많은 것을 알게 해줍니다.</p>
  <div class="btn-row">

  </div>`;
}

/* ---------- ⑧ 실천 3개 선택 ---------- */
function scSelect(){
  const ranked = rankedActions(true);
  const n = S.picked.length, need = CONFIG.ACTIONS_TO_PICK;
  return `
  <h1>2주 동안 실험할<br>행동 ${need}개를 고릅니다.</h1>
  <p class="lede">감축 잠재력이 큰 순서로 보여드리지만, 지금 생활에서 실제로 해볼 만한 것을 고르는 편이 좋습니다.
  해보고 안 되는 이유를 알아내는 것도 이 2주의 목적입니다.</p>
  <div style="margin:26px 0 0">
    ${ranked.map(({a,p})=>{
      const on = S.picked.includes(a.id);
      const locked = !on && S.picked.length >= need;
      return `<button class="act${locked?" locked":""}" data-pick="${a.id}" aria-pressed="${on}">
        <div class="act-top">
          <div>
            <div class="act-name">${esc(a.name)}</div>
            <div class="act-desc">${esc(a.desc)}</div>
            <div class="act-desc" style="margin-top:5px;color:var(--ink-2)">
              ${a.track==="common" ? "먹거리·소비 공통 기록과 자동 연동" : "매일 간단한 추가 기록"}
            </div>
          </div>
          ${potTag(p)}
        </div>
      </button>`;
    }).join("")}
  </div>
  ${n ? `<div style="margin-top:6px"><button class="linkish" data-clearpicks>선택 모두 지우기</button></div>` : ``}
  <div class="pickbar">
    <div class="cnt">${n} / ${need} 선택${n===need?" — 선택이 끝났습니다" : ""}</div>
    ${S.pickWarn ? `<div class="warn" style="margin-bottom:9px">이미 ${need}개를 골랐습니다. 다른 것을 고르려면 먼저 선택한 것 중 하나를 눌러 해제해주세요.</div>` : ``}
    <div style="display:flex;gap:10px">
      <button class="btn ghost" data-go="twoweek" style="flex:1">이전</button>
      <button class="btn" data-go="log" style="flex:2" ${n===need?"":"disabled"}>14일 기록 시작하기</button>
    </div>
  </div>`;
}
/* ---------- ⑨ 14일 기록 ---------- */
function pickedActions(){ return ACTIONS.filter(a=>S.picked.includes(a.id)); }
function hasTrack(t){ return pickedActions().some(a=>a.track===t); }
function hasAction(id){ return S.picked.includes(id); }

function chipRow(field, opts, cur){
  return `<div class="chips">${opts.map((o,i)=>
    `<button class="chip" data-log="${field}" data-v="${i}" aria-pressed="${cur===i}">${esc(o)}</button>`).join("")}</div>`;
}
/* 그날 반드시 채워야 하는 항목 */
function requiredFields(){
  const req = ["meat","eatout","coffee","buy"];
  if(hasTrack("car")) LOG_MODES.forEach(m=>req.push(m.f));
  if(hasAction("heat30")) req.push("heat");
  if(hasAction("power30")) req.push("power");
  if(hasTrack("home")) req.push("ai");
  if(hasTrack("leisure")) req.push("screen");
  return req;
}
function missingFields(d){
  const l = S.logs[d] || {};
  return requiredFields().filter(f => l[f] === undefined);
}
function scLog(){
  const d = S.day, log = S.logs[d] || {};
  const miss = missingFields(d);
  const doneCount = Object.values(S.logs).filter(l=>l && l._done).length;
  const acts = pickedActions();
  return `
  <div class="sect-head" style="justify-content:space-between;margin-bottom:16px">
    <h2>${d+1}일차 기록</h2>

      const done = S.logs[i] && S.logs[i]._done;

      // 7일차와 8일차 사이에 중간 결과 칸을 둡니다.

  <div class="card" style="margin-bottom:20px;padding:14px 16px">

/* ============================================================
   G2. 결과 이미지 저장 (외부 라이브러리 없이 캔버스로 직접 그립니다)
   ============================================================ */
function drawResultCard(){
  const r = calculate(), T = CONFIG.TARGET_2030;
  const isFinal = S.screen === "final";
  const P = isFinal ? programSummary() : null;
  const W = 1080, H = isFinal ? 1900 : 1180;
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d");
  const F = '"IBM Plex Sans KR", sans-serif';
  const INK="#14302B", DIM="#6E837D", RULE="#C9D2C6", TRACK="#DCE2D8",
        OVER="#9E2A3B", WIN="#2F6F55", MID="#2F5E78";
  const cols = { food:"#4E7B4B", consumption:"#9A7B3F", transport:"#2F5E78",
                 housing:"#7A4A5C", leisure:"#5E6B6E" };
  x.fillStyle = "#EDF0EA"; x.fillRect(0,0,W,H);
  const L = 80, BW = W - 160;
  const rule = y => { x.strokeStyle = RULE; x.lineWidth = 1;
    x.beginPath(); x.moveTo(L,y); x.lineTo(W-L,y); x.stroke(); };

  let y = 96;
  x.fillStyle = DIM; x.font = `400 28px ${F}`;
  x.fillText("1.5℃ 라이프스타일 2주 살기", L, y);
  y += 70;
  x.fillStyle = INK; x.font = `600 50px ${F}`;
  x.fillText(isFinal ? "2주 살기 결과" : "나의 연간 탄소발자국", L, y);

  /* 1층 — 시작할 때의 나 */
  y += 84;
  x.fillStyle = DIM; x.font = `500 26px ${F}`;
  x.fillText(isFinal ? "시작할 때의 나" : "나의 예상 연간 라이프스타일 탄소발자국", L, y);
  y += 96;
  x.fillStyle = r.total > T ? OVER : WIN; x.font = `600 108px ${F}`;
  const tot = fmt(r.total);
  x.fillText(tot, L, y);
  const totW = x.measureText(tot).width;      // 큰 글씨 폭을 먼저 잰 뒤 폰트를 바꿉니다
  x.fillStyle = DIM; x.font = `400 34px ${F}`;
  x.fillText("톤", L + totW + 24, y);

  /* 예산선 */
  y += 60;
  const max = Math.max(CONFIG.KOREA_AVG, r.total*1.08, T*1.6);
  const px = v => BW * Math.min(1, v/max);
  x.fillStyle = INK; x.font = `600 24px ${F}`;
  x.fillText(`1.5℃ 한계선 ${fmt(T)}`, Math.max(L, L + px(T) - 92), y);
  y += 18;
  x.fillStyle = TRACK; x.fillRect(L, y, BW, 32);
  x.fillStyle = WIN;   x.fillRect(L, y, px(Math.min(r.total,T)), 32);
  if(r.total > T){ x.fillStyle = OVER; x.fillRect(L+px(T), y, px(r.total)-px(T), 32); }
  x.fillStyle = INK; x.fillRect(L + px(T) - 3, y - 12, 6, 56);
  y += 76;
  x.fillStyle = DIM; x.font = `400 24px ${F}`;
  x.fillText(`한국 평균 ${fmt(CONFIG.KOREA_AVG)}톤`, W - L - 150, y);

  /* 분야별 */
  y += 40; rule(y); y += 54;
  x.fillStyle = INK; x.font = `600 32px ${F}`;
  x.fillText("분야별 배출량", L, y);
  const ent = SECTOR_KEYS.map(k=>[k, r.sectors[k]]).sort((a,b)=>b[1]-a[1]);
  const mx = ent[0][1] || 1;
  ent.forEach(([k,v])=>{
    y += 58;
    x.fillStyle = INK; x.font = `400 27px ${F}`;
    x.fillText(SECTORS[k].name, L, y + 21);
    x.fillStyle = TRACK; x.fillRect(L+150, y, 560, 26);
    x.fillStyle = cols[k]; x.fillRect(L+150, y, 560 * (v/mx), 26);
    x.fillStyle = DIM; x.font = `400 25px ${F}`;
    x.fillText(`${fmt(v)}톤 · ${Math.round(v/r.total*100)}%`, L+730, y+22);
  });

  if(isFinal){
    /* 2층 — 바뀐 행동 */
    y += 66; rule(y); y += 56;
    x.fillStyle = INK; x.font = `600 32px ${F}`;
    x.fillText("2주 동안 실제로 바뀐 행동", L, y);
    const b = P.base, n = P.days || 1, sc = CONFIG.PROGRAM_DAYS / n;
    const rows = [
      ["육식 끼니", Math.round(b.meatMealsDay*n*sc), Math.round(P.sum.meat*sc), "끼"],
      ["외식·배달", Math.round(b.eatOutDay*n*sc),    Math.round(P.sum.eatout*sc), "회"],
      ["커피",      Math.round(b.coffeeDay*n*sc),    Math.round(P.sum.coffee*sc), "잔"]
    ];
    if(hasTrack("car"))
      rows.push(["승용차 이용", Math.round(b.carHoursDay*n*sc), Math.round(P.sum.carhr*sc), "시간"]);
    rows.forEach(([nm,was,now,u])=>{
      y += 54;
      x.fillStyle = INK; x.font = `400 27px ${F}`; x.fillText(nm, L, y);
      x.fillStyle = DIM; x.font = `400 27px ${F}`;
      const wt = `${was}${u}`;
      x.fillText(wt, L+420, y);
      const wl = x.measureText(wt).width;
      x.beginPath(); x.moveTo(L+420, y-9); x.lineTo(L+420+wl, y-9); x.strokeStyle = DIM; x.stroke();
      x.fillText("→", L+420+wl+22, y);
      x.fillStyle = now < was ? WIN : INK; x.font = `600 27px ${F}`;
      x.fillText(`${now}${u}`, L+420+wl+70, y);
    });
    y += 54;
    x.fillStyle = DIM; x.font = `400 26px ${F}`;
    x.fillText(`2주 동안 줄어든 양  ${fmt(P.totalKg,1)} 킬로그램`, L, y);

    /* 3층 — 지속했을 때 */
    y += 46; rule(y); y += 56;
    x.fillStyle = INK; x.font = `600 32px ${F}`;
    x.fillText("이 생활을 지속했을 때", L, y);
    y += 30;
    const m2 = Math.max(CONFIG.KOREA_AVG, r.total*1.08, T*1.6);
    const p2 = v => BW * Math.min(1, v/m2);
    [["현재", r.total, OVER], ["1년간 지속하면", P.after, MID], ["2030년 목표", T, WIN]]
      .forEach(([lab,v,col])=>{
        y += 40;
        x.fillStyle = DIM; x.font = `400 24px ${F}`; x.fillText(lab, L, y);
        x.fillStyle = col; x.font = `600 30px ${F}`;
        const vt = `${fmt(v)}톤`;
        x.fillText(vt, W - L - x.measureText(vt).width, y);
        y += 14;
        x.fillStyle = TRACK; x.fillRect(L, y, BW, 26);
        x.fillStyle = col;   x.fillRect(L, y, p2(v), 26);
        x.fillStyle = INK;   x.fillRect(L + p2(T) - 2, y - 5, 4, 36);
        y += 32;
      });
    y += 52;
    x.fillStyle = INK; x.font = `600 30px ${F}`;
    const remain = Math.max(0, P.after - T);
    x.fillText(remain > 0.05
      ? `1.5℃ 라이프스타일 목표에 ${fmt(remain)}톤이 모자랍니다.`
      : `2030년 목표선 안에 들어왔습니다.`, L, y);
    y += 46;
    x.fillStyle = DIM; x.font = `400 25px ${F}`;
    x.fillText("남은 차이는 모두 개인의 노력으로 줄이기 힘든 것들이 많습니다.", L, y);
  }

  const pf = S.profile || {};
  x.fillStyle = DIM; x.font = `400 24px ${F}`;
  x.fillText(`${pf.name ? pf.name + " · " : ""}${new Date().toLocaleDateString("ko-KR")}`, L, H - 56);
  return c;
}

/* 결과 이미지를 화면에 띄우고, 가능한 모든 방법으로 저장을 돕습니다.
   일부 미리보기 환경은 파일 내려받기를 막기 때문에
   ① 내려받기 ② 새 탭에서 열기 ③ 길게 눌러 저장 세 가지를 모두 제공합니다. */
function saveScreenImage(){
  const c = drawResultCard();
  const name = `1.5도라이프스타일_${S.screen==="final"?"2주결과":"탄소발자국"}_${new Date().toISOString().slice(0,10)}.png`;
  const dataUrl = c.toDataURL("image/png");
  openModal(`
    <h2 style="margin-bottom:6px">결과 이미지</h2>
    <p class="muted">이미지를 길게 누르면(컴퓨터는 오른쪽 클릭) 바로 저장할 수 있습니다.</p>
    <img src="${dataUrl}" alt="결과 이미지" class="resultimg">
    <div class="btn-row" style="margin-top:16px">
      <button class="btn ghost" data-img-open>새 탭에서 열기</button>
      <button class="btn" data-img-save>이미지 내려받기</button>
    </div>
    <p class="muted" id="imgMsg" style="margin-top:12px"></p>
  `);
  c.toBlob(blob=>{
    if(!blob) return;
    const url = URL.createObjectURL(blob);
    const msg = document.getElementById("imgMsg");
    const openBtn = document.querySelector("[data-img-open]");
    const saveBtn = document.querySelector("[data-img-save]");
    if(openBtn) openBtn.onclick = ()=>{
      const w = window.open(url, "_blank");
      if(!w && msg) msg.textContent = "새 탭이 차단되었습니다. 위 이미지를 길게 눌러 저장해주세요.";
    };
    if(saveBtn) saveBtn.onclick = async ()=>{
      // 1) 모바일 공유 시트 (가능한 기기에서 가장 확실합니다)
      try{
        const file = new File([blob], name, { type:"image/png" });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          await navigator.share({ files:[file], title:"1.5℃ 라이프스타일 결과" });
          return;
        }
      }catch(e){}
      // 2) 일반 내려받기
      try{
        const a = document.createElement("a");
        a.href = url; a.download = name; a.rel = "noopener";
        document.body.appendChild(a); a.click(); a.remove();
        if(msg) msg.textContent = "저장이 시작되지 않으면 위 이미지를 길게 눌러 저장해주세요.";
      }catch(e){
        if(msg) msg.textContent = "이 환경에서는 내려받기가 막혀 있습니다. 위 이미지를 길게 눌러 저장해주세요.";
      }
    };
  }, "image/png");
}

/* ============================================================
   렌더 & 이벤트
   ============================================================ */
const VIEWS = { intro:scIntro, why:scWhy, profile:scProfile, calcIntro:scCalcIntro, calc:scCalc,
                result:scResult, actions:scActions, twoweek:scTwoweek, select:scSelect,
                social:scSocial, policy:scPolicy,
                log:scLog, midpoint:scMidpoint, final:scFinal };

function render(){
  const fn = VIEWS[S.screen] || scIntro;
  document.body.classList.remove("bold-nums");
  $("#screens").innerHTML = `<section class="screen live">${fn()}</section>`;
  renderRail();
  syncFooterTools();
}

function openModal(html){
  $("#modalBody").innerHTML = html;
  $("#modal").classList.add("live");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  $("#modal").classList.remove("live");
  document.body.style.overflow = "";
}

/* 시연용 예시 응답 */
const DEMO_ANSWERS = {
  eatOut:5, diet:0, coffee:1, waste:1,
  clothes:12, mend:2,
  appliances:{ricecooker:1, fridge:1, aircon:1, tv:1, vacuum:1, washer:1, microwave:1},
  devices:{phone:1, laptop:1, tablet:1},
  pets:{cat:0, dog:0},
  subway:2, bus:1.5, bike:0, ev:0, car:7, train:3, flight:5,
  members:2, areaTotal:25, elec:2, heatType:0, heatCost:1, solar:0, insulation:0, ai:1,
  leisureWays:["mobile","book"], ski:0, golf:0, stay:6
};

function fillDemoDays(){
  for(let i=0;i<CONFIG.PROGRAM_DAYS;i++){
    const late = i >= 4;                       // 며칠 지나며 자리잡는 흐름
    const l = { _done:true, barriers:[] };
    l.meat   = late ? (i%3===0 ? 0 : 1) : (i%2===0 ? 2 : 1);
    l.eatout = (i%4===0) ? 1 : 0;
    l.coffee = late ? 1 : 2;
    l.buy    = (i%7===0) ? 1 : 0;
    if(hasTrack("car")){
      l.carhr    = late ? ((i%3===0)?1:2) : 2;     // 내연기관 승용차
      l.evhr     = 0;
      l.subwayhr = late ? 2 : 1;                   // 줄인 만큼 대중교통으로
      l.bushr    = late ? 1 : 0;
      l.bikehr   = late ? ((i%2===0)?1:0) : 0;
    }
    if(hasTrack("home"))     l.ai     = late ? 1 : 2;
    if(hasAction("heat30"))  l.heat   = late ? (i%3===0?2:1) : 0;
    if(hasAction("power30")){
      l.power = late ? 1 : 0;
      if(late && i%4===0) l.powerNote = "안 쓰는 플러그를 뽑고 조명을 절반만 켰다.";
    }
    if(hasTrack("leisure"))  l.screen = (i%3!==0) ? 1 : 0;
    const pool = [];
    if(hasTrack("car")) pool.push("transit");
    if(hasAction("heat30")) pool.push("house");
    pool.push("menu","time");
    if(i%3===0) l.barriers.push(pool[i%pool.length]);
    if(i%5===0) l.barriers.push("menu");
    if(i%4===1) l.barriers.push("none");
    S.logs[i] = l;
  }
  S.logs[3].note = "회식이 잡혀서 채식을 하려다 못 했다.";
  S.logs[9].note = "아이 하원 시간 때문에 차를 두고 나갈 수 없었다.";
}

document.addEventListener("click", e => {
  // 입력칸·선택상자를 누른 것은 화면 전환 동작으로 해석하지 않습니다.
  const tag = e.target.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "LABEL") return;
  const t = e.target.closest("[data-go],[data-modal],[data-q],[data-calcnext],[data-calcprev],"+
    "[data-pick],[data-day],[data-log],[data-barrier],[data-savelog],[data-daynav],[data-demo],"+
    "[data-recalc],[data-calcback],[data-restart],[data-target],[data-theme],[data-close],"+
    "[data-skip-to-log],[data-policy-round],[data-save-image],[data-csv],[data-multi],[data-num],[data-count],"+
    "[data-policy],[data-policy-done],[data-social],[data-pre],[data-clearpicks],[data-doing]");
  if(!t) return;

  if(t.hasAttribute("data-close")){ closeModal(); return; }

  if(t.dataset.go){ closeModal(); go(t.dataset.go); return; }

  if(t.dataset.modal === "basis"){ openModal(modalBasis()); return; }
  if(t.dataset.modal === "install"){ openModal(modalInstall()); return; }

  if(t.hasAttribute("data-skip-to-log")){
    // 계산을 건너뛴 경우에도 실천 선택은 거치도록 합니다.
    go(S.picked.length === CONFIG.ACTIONS_TO_PICK ? "log" : "select"); return;
  }
  if(t.dataset.policyRound){
    S.policyRound = Number(t.dataset.policyRound); S.policyWarn = false;
    save(); go("policy"); return;
  }
  if(t.dataset.saveImage){ saveScreenImage(); return; }
  if(t.hasAttribute("data-csv")){ downloadCsv(); return; }

  if(t.dataset.q !== undefined){
    S.answers[t.dataset.q] = Number(t.dataset.i); save(); render(); return;
  }
  if(t.dataset.pre !== undefined){
    S.profile = S.profile || {};
    S.profile[t.dataset.pre] = Number(t.dataset.i); save(); render(); return;
  }
  if(t.dataset.multi !== undefined){
    const id = t.dataset.multi, k = t.dataset.k;
    const cur = Array.isArray(S.answers[id]) ? S.answers[id].slice() : [];
    const i = cur.indexOf(k);
    if(i>=0) cur.splice(i,1); else cur.push(k);
    S.answers[id] = cur; save(); render(); return;
  }
  if(t.dataset.num !== undefined){
    const id = t.dataset.num, q = findQuestion(id);
    const cur = num(S.answers[id], q && q.def !== undefined ? q.def : 0);
    const next = Math.max(q&&q.min!==undefined?q.min:0,
                 Math.min(q&&q.max||999, Math.round((cur + Number(t.dataset.delta))*10)/10));
    S.answers[id] = next; save(); render(); return;
  }
  if(t.dataset.count !== undefined){
    const id = t.dataset.count, k = t.dataset.k;
    const cur = Object.assign({}, S.answers[id] || {});
    cur[k] = Math.max(0, Math.min(20, num(cur[k]) + Number(t.dataset.delta)));
    S.answers[id] = cur; save(); render(); return;
  }
  if(t.hasAttribute("data-calcnext")){
    if(S.wizardStep < SECTOR_KEYS.length-1){ S.wizardStep++; save(); render(); window.scrollTo({top:0}); }
    else { go("result"); }
    return;
  }
  if(t.hasAttribute("data-calcprev")){
    if(S.wizardStep > 0){ S.wizardStep--; save(); render(); window.scrollTo({top:0}); }
    else go("calcIntro");
    return;
  }
  if(t.hasAttribute("data-calcback")){ S.wizardStep = SECTOR_KEYS.length-1; go("calc"); return; }
  if(t.hasAttribute("data-recalc")){
    // 다시 계산하면 이전 회차에 골라둔 실천과 기록을 비웁니다.
    S.wizardStep = 0; S.picked = []; S.logs = {}; S.day = 0;
    S.policies = []; S.social = []; S.pickWarn = false;
    go("calc"); return;
  }

  if(t.hasAttribute("data-clearpicks")){ S.picked = []; S.pickWarn = false; save(); render(); return; }
  if(t.dataset.pick){
    const id = t.dataset.pick, i = S.picked.indexOf(id);
    if(i >= 0){ S.picked.splice(i,1); S.pickWarn = false; }
    else if(S.picked.length < CONFIG.ACTIONS_TO_PICK){ S.picked.push(id); S.pickWarn = false; }
    else { S.pickWarn = true; }   // 자동 해제하지 않고 안내만 합니다
    save(); render();
    if(S.pickWarn) window.scrollTo({top:document.body.scrollHeight, behavior:"smooth"});
    return;
  }

  if(t.dataset.social !== undefined){
    const v = t.dataset.social;
    S.social = S.social || [];
    const i = S.social.indexOf(v);
    if(i>=0) S.social.splice(i,1); else S.social.push(v);
    save(); render(); return;
  }
  if(t.dataset.policy !== undefined){
    const key = policyKey(), v = t.dataset.policy;
    S[key] = S[key] || [];
    const i = S[key].indexOf(v);
    if(i>=0){ S[key].splice(i,1); S.policyWarn = false; }
    else if(S[key].length < 3){ S[key].push(v); S.policyWarn = false; }
    else S.policyWarn = true;
    save(); render(); return;
  }
  if(t.hasAttribute("data-policy-done")){
    if(S.policyRound === 2){ go("final"); return; }
    S.day = Math.min(CONFIG.PROGRAM_DAYS-1, CONFIG.MIDPOINT_DAY);
    save(); go("log"); return;
  }
  if(t.dataset.day !== undefined){ S.day = Number(t.dataset.day); save(); render(); return; }
  if(t.dataset.daynav){
    const step = Number(t.dataset.daynav);
    if(step < 0 && S.day === 0){ go("select"); return; }
    S.day = Math.max(0, Math.min(CONFIG.PROGRAM_DAYS-1, S.day + step));
    save(); render(); window.scrollTo({top:0}); return;
  }
  if(t.dataset.log !== undefined){
    const l = S.logs[S.day] = S.logs[S.day] || {};
    l[t.dataset.log] = Number(t.dataset.v);
    save(); render(); return;
  }
  if(t.dataset.barrier){
    const l = S.logs[S.day] = S.logs[S.day] || {};
    l.barriers = l.barriers || [];
    const id = t.dataset.barrier, i = l.barriers.indexOf(id);
    if(i>=0) l.barriers.splice(i,1);
    else {
      if(id==="none") l.barriers = ["none"];
      else { l.barriers = l.barriers.filter(x=>x!=="none"); l.barriers.push(id); }
    }
    save(); render(); return;
  }
  if(t.hasAttribute("data-savelog")){
    if(missingFields(S.day).length){ render(); return; }
    const l = S.logs[S.day] = S.logs[S.day] || {};
    l._done = true; save();
    if(S.day === CONFIG.MIDPOINT_DAY-1){ go("midpoint"); return; }   // 7일차 중간 결과
    if(S.day < CONFIG.PROGRAM_DAYS-1){ S.day++; save(); render(); window.scrollTo({top:0}); }
    else { go("final"); }
    return;
  }

  if(t.dataset.demo === "profile"){
    S.profile = Object.assign({}, S.profile, { name:"홍길동", contact:"010-1234-5678" });
    save(); render(); return;
  }
  if(t.dataset.demo === "fill"){
    S.answers = Object.assign({}, DEMO_ANSWERS); save(); render(); return;
  }
  if(t.dataset.demo === "days"){ fillDemoDays(); save(); go("final"); return; }

  if(t.dataset.target){
    CONFIG.TARGET_2030 = Number(t.dataset.target);
    TARGET_BASIS.rows[3][1] = fmt(CONFIG.TARGET_2030) + "톤 (본 프로젝트 설정값)";
    openModal(modalSettings()); render(); return;
  }
  if(t.dataset.theme){
    document.documentElement.setAttribute("data-theme", t.dataset.theme);
    openModal(modalSettings()); return;
  }
  if(t.hasAttribute("data-restart")){
    S = { screen:"intro", answers:{}, wizardStep:0, picked:[], day:0, logs:{} };
    save(); closeModal(); render(); window.scrollTo({top:0}); return;
  }
});

/* 숫자를 타이핑하는 중에는 화면을 다시 그리지 않고 버튼 상태만 바꿉니다. */
function refreshCalcNav(){
  if(S.screen !== "calc") return;
  const qs = QUESTIONS[SECTOR_KEYS[S.wizardStep]];
  const btn = document.querySelector("[data-calcnext]");
  if(btn) btn.disabled = qs.some(q => !qAnswered(q));
}

/* 입력 중에는 화면을 다시 그리지 않고 버튼·안내만 갱신합니다. */
function syncProfileNav(){
  const ok = profileReady();
  const btn = document.querySelector('[data-go="calcIntro"].btn');
  if(btn) btn.disabled = !ok;
  const hint = document.getElementById("profileHint");
  if(hint) hint.style.display = ok ? "none" : "";
}

function findQuestion(id){
  for(const k of SECTOR_KEYS){ const q = QUESTIONS[k].find(x=>x.id===id); if(q) return q; }
  return null;
}

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.hasAttribute && t.hasAttribute("data-numinput")){
    const id = t.dataset.numinput;
    S.answers[id] = t.value === "" ? "" : Number(t.value);
    save(); refreshCalcNav(); return;
  }
  if(t.hasAttribute && t.hasAttribute("data-countinput")){
    const id = t.dataset.countinput, k = t.dataset.k;
    const cur = Object.assign({}, S.answers[id] || {});
    cur[k] = num(t.value);
    S.answers[id] = cur; save(); refreshCalcNav(); return;
  }
  if(t.hasAttribute && t.hasAttribute("data-doing")){
    const l = S.logs[S.day] = S.logs[S.day] || {};
    l[t.dataset.doing + "Note"] = t.value; save(); return;
  }
  if(t.hasAttribute && t.hasAttribute("data-note")){
    const l = S.logs[S.day] = S.logs[S.day] || {};
    l.note = t.value; save();
  }
  if(t.hasAttribute && t.hasAttribute("data-phone")){
    const pos = t.selectionStart, before = t.value;
    const f = formatPhone(t.value);
    t.value = f;
    if(f.length > before.length) t.setSelectionRange(f.length, f.length);
    else if(pos !== null) t.setSelectionRange(pos, pos);
    S.profile = S.profile || {};
    S.profile.contact = f; save();
    const bad = f.length > 0 && !phoneValid(f);
    t.classList.toggle("bad", bad);
    const msg = document.getElementById("phoneMsg");
    if(msg){
      msg.classList.toggle("bad", bad);
      msg.textContent = bad ? "휴대전화번호 11자리를 확인해주세요."
                            : "숫자만 입력하면 자동으로 하이픈이 붙습니다.";
    }
    syncProfileNav();
    return;
  }
  if(t.hasAttribute && t.hasAttribute("data-profile")){
    S.profile = S.profile || {};
    S.profile[t.dataset.profile] = t.value; save();
    // 입력 중 화면을 다시 그리면 포커스가 사라지므로 버튼 상태만 갱신합니다.
    syncProfileNav();
  }
});

document.addEventListener("change", e=>{
  const t = e.target;
  if(t.hasAttribute && t.hasAttribute("data-pre-select")){
    S.profile = S.profile || {};
    const v = t.value;
    if(v === "") delete S.profile[t.dataset.preSelect];
    else S.profile[t.dataset.preSelect] = Number(v);
    save();
  }
});

document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

load();
render();
</script>
